name: DRF CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python manage.py test
        env:
          SECRET_KEY: test_secret_key

  build:
      needs: test
      runs-on: ubuntu-latest

      steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Login DockerHub
        run: echo ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} | docker login -u ${{ secrets.DOCKER_HUB_USERNAME }} --password-stdin

      - name: Build image
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/drf:${{ github.sha }} .

      - name: Push image
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/drf:${{ github.sha }}

  deploy:
      runs-on: ubuntu-latest
      needs: build

      steps:
        - name: Set up SSH
          uses: webfactory/ssh-agent@v0.9.0
          with:
            ssh-private-key: ${{ secrets.SSH_KEY }}

        - name: Deploy to server
          run: |
            ssh -t -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
            sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/drf:${{ github.sha }}
            sudo docker stop drf || true
            sudo docker rm drf || true
            sudo docker run -d --name drf -p 80:8000 ${{ secrets.DOCKER_HUB_USERNAME }}/drf:${{ github.sha }}
            EOF
